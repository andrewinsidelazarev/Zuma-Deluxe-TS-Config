; Level Select scene background — source pages #54..#5C (9 × 16K = 360×288 framebuffer).
; Runtime source pages #54..#5C are built from compressed storage #70..#78.

; Dispname atlas — 4 unique строки × 11 × 512 stride = 22528 байт, разделены
; на 2 page'а × 2 rows × 11 × 512 = 11264 байта каждая.
